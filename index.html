<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link href="styles.css" rel="stylesheet">
    <script src="scripts.js" defer></script>
</head>

<body>
    <div>
        <div class="header">
            <button popovertarget="new-book">New book</button>
            <dialog id="new-book" popover>
                <h3>Add a new book</h3>
                <button popovertarget="new-book" popovertargetaction="show">X</button>
                <form>
                    <legend>Enter book details</legend>

                    <label for="title">Title</label>
                    <input id="title" type="text" placeholder="What's the book called?" required minlength="2" maxlength="150">

                    <label for="author">Author</label>
                    <input id="author" type="text" placeholder="Who's the author?" required pattern="^[A-Za-zÀ-ÿ'\-\.\s\,]+$" minlength="1" maxlength="100">

                    <label for="pages">No. of pages</label>
                    <input id="pages" type="number" placeholder="How many pages does it have?" required step="1" min="2" max="1000">

                    <button class="submit-button">Add book</button>
                </form>
            </dialog>
            <h1>Library</h1>
        </div>
        <div class="catalog">
            <button class="remove">Remove Book</button>
        </div>
    </div>
</body>

</html>
